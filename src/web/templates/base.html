<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIGA Fiscal — Automação SEFAZ-CE{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        ceara: {
                            green: '#008744',
                            gold: '#ffa700',
                            blue: '#0057b7',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-bold text-xl shadow-md">
                    SF
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 tracking-tight leading-none">SIGA Fiscal</h1>
                    <p class="text-xs text-slate-500 font-medium">Automação SEFAZ-CE • Certificado A1</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="flex items-center space-x-1 sm:space-x-2">
                <a href="/" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'dashboard' %}bg-emerald-50 text-emerald-700 font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                    Dashboard
                </a>
                <a href="/empresas" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'empresas' %}bg-emerald-50 text-emerald-700 font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                    Empresas
                </a>
                <a href="/consultas/nova" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'nova_consulta' %}bg-emerald-50 text-emerald-700 font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                    Nova Consulta
                </a>
                <a href="/historico" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'historico' %}bg-emerald-50 text-emerald-700 font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                    Histórico
                </a>
                <a href="/configuracoes" class="px-3 py-2 rounded-md text-sm font-medium {% if active_page == 'configuracoes' %}bg-emerald-50 text-emerald-700 font-semibold{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                    Configurações
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            SIGA Fiscal v1.0.0 — SEFAZ-CE • Sistema Seguro com Sessões Isoladas e Autenticação Manual A1
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
